[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discount-curve"
version = "0.1.0"
description = "Robust machine learning for Treasury discount curve estimation"
authors = [
    {name = "Azizallah Farhadi", email = "farhadmy1974@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
